[project]
name = "darwin-router"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "numpy",
    "python-dotenv",
    "sentence-transformers",
    "google-generativeai",
    "matplotlib",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

